[project]
name = "mach-agents"
version = "0.1.0"
description = "Livello di comunicazione e agenti di servizio per il Milano Agentic City Hackathon"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["a2a_lite*", "registry*", "agents*", "contracts*", "interop*", "gateway*"]

[tool.setuptools.package-data]
agents = ["*/data.json"]
contracts = ["schemas/*.json", "examples/*.json"]
gateway = ["*.json"]
